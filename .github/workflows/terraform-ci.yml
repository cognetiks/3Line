name: "3Line CI/CD"

# Validates, plans, and applies Terraform changes on push/PR to main.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write

jobs:
  fmt-check:
    name: "Terraform Format Check"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: "Check formatting"
        working-directory: infrastructure
        run: terraform fmt -check -recursive -diff

  validate:
    name: "Validate (${{ matrix.environment }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: dev
            aws_region: us-east-1
          - environment: prod
            aws_region: us-east-1
          - environment: dr
            aws_region: us-west-2
    defaults:
      run:
        working-directory: infrastructure/environments/${{ matrix.environment }}
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: "Terraform init (no backend/state)"
        run: terraform init -backend=false -input=false

      - name: "Terraform validate"
        run: terraform validate -no-color

  plan:
    name: "Plan (${{ matrix.environment }})"
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: dev
            aws_region: us-east-1
          - environment: prod
            aws_region: us-east-1
          - environment: dr
            aws_region: us-west-2
    defaults:
      run:
        working-directory: infrastructure/environments/${{ matrix.environment }}
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: "Configure AWS credentials"
        if: ${{ vars.AWS_ROLE_ARN != '' && vars.TF_STATE_BUCKET != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ matrix.aws_region }}

      - name: "Terraform init (remote state)"
        if: ${{ vars.AWS_ROLE_ARN != '' && vars.TF_STATE_BUCKET != '' }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ matrix.environment }}/terraform.tfstate" \
            -backend-config="region=${{ matrix.aws_region }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}"

      - name: "Terraform plan"
        if: ${{ vars.AWS_ROLE_ARN != '' && vars.TF_STATE_BUCKET != '' }}
        run: terraform plan -input=false -no-color -out=tfplan

      - name: "Upload plan artifact"
        if: ${{ vars.AWS_ROLE_ARN != '' && vars.TF_STATE_BUCKET != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: infrastructure/environments/${{ matrix.environment }}/tfplan
          retention-days: 5

      - name: "Plan skipped (no AWS role/state bucket configured)"
        if: ${{ vars.AWS_ROLE_ARN == '' || vars.TF_STATE_BUCKET == '' }}
        run: echo "AWS_ROLE_ARN/TF_STATE_BUCKET repo variables are not set - no AWS credentials used, no plan generated, nothing provisioned."

  apply:
    name: "Apply (${{ matrix.environment }})"
    runs-on: ubuntu-latest
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: dev
            aws_region: us-east-1
          - environment: prod
            aws_region: us-east-1
          - environment: dr
            aws_region: us-west-2

    environment: ${{ matrix.environment }}
    defaults:
      run:
        working-directory: infrastructure/environments/${{ matrix.environment }}
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: "Configure AWS credentials"
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != '' && vars.TF_STATE_BUCKET != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ matrix.aws_region }}

      - name: "Terraform init (remote state)"
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != '' && vars.TF_STATE_BUCKET != '' }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ matrix.environment }}/terraform.tfstate" \
            -backend-config="region=${{ matrix.aws_region }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}"

      - name: "Download plan artifact"
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != '' && vars.TF_STATE_BUCKET != '' }}
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: infrastructure/environments/${{ matrix.environment }}

      - name: "Terraform apply"
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != '' && vars.TF_STATE_BUCKET != '' }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: "Apply skipped (no AWS role/state bucket configured)"
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') || vars.AWS_ROLE_ARN == '' || vars.TF_STATE_BUCKET == '' }}
        run: echo "AWS_ROLE_ARN/TF_STATE_BUCKET repo variables are not set (or this isn't a push to main) - no AWS credentials used, nothing applied or provisioned."


